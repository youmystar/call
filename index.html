<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拨打电话功能</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .quick-call-section {
            margin-top: 0;
        }

        .quick-call-title {
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .quick-call-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .quick-call-btn {
            padding: 12px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .quick-call-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .quick-call-btn .number {
            font-size: 16px;
            font-weight: 600;
        }

        .quick-call-btn .label {
            font-size: 12px;
            opacity: 0.8;
        }

        .info {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📞 拨打电话</h1>
        
        <div class="quick-call-section">
            <div class="quick-call-title">快速拨打：</div>
            <div class="quick-call-buttons">
                <a href="#" class="quick-call-btn" data-phone="15801632404">
                    <span class="number">15801632404</span>
                    <span class="label">点击拨打</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 快速拨打按钮点击事件
        const quickCallBtns = document.querySelectorAll('.quick-call-btn');
        
        quickCallBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const phoneNumber = this.getAttribute('data-phone');
                if (phoneNumber) {
                    window.location.href = `tel:${phoneNumber}`;
                }
            });
        });
    </script>
</body>
</html>
